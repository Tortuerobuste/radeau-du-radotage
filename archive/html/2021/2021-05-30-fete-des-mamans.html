<h1>Fête des mamans</h1>
<p class="meta">2021-05-30 · Non classé</p>
<p>Je pense à toutes les mamans</p>
<p>Qui ont vu partir leur enfant</p>
<p>Je les serre tout doucement</p>
<p>Pour partager leur tourment</p>
<p>Contre mon coeur.</p>
