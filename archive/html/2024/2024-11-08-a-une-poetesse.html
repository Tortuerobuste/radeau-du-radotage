<h1>A une poétesse</h1>
<p class="meta">2024-11-08 · Non classé</p>
<p>Chacun de tes poèmes</p>
<p>Qui l&rsquo;euphorie sèment</p>
<p>Donne aux autres l&rsquo;envie</p>
<p>De chevaucher Pégase</p>
<p>Pour cueillir à l&rsquo;envi</p>
<p>Ces mots porteurs d&rsquo;extase</p>
<p>Et par toi sublimés</p>
<p>Dans un écrin rimé.</p>
