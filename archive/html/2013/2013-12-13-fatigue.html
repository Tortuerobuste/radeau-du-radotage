<h1>Fatigue</h1>
<p class="meta">2013-12-13 · Non classé</p>
<p>Cette énorme fatigue<br />
Qui envahit les membres<br />
Comme après une gigue<br />
Comme nuit de décembre.<br />
Cette douleur sourde<br />
A la moindre insouciance<br />
Cette pesanteur lourde<br />
Qui écrase l’essence…</p>
